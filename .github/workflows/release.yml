name: Release

# 在 GitHub 上发布 Release（或手动触发）时，构建 Windows 安装包并上传到该 Release。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要上传到的 Release 标签（例如 v0.3.0）
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Package (full, with CUDA)
        run: npx electron-builder --config electron-builder.config.cjs --win nsis portable --publish never

      - name: Package (lite, CPU + Vulkan)
        env:
          A18_NO_CUDA: '1'
        run: npx electron-builder --config electron-builder.config.cjs --win nsis portable --publish never

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/*.exe --clobber
